[project]
name = "desafio-final-ibm-confluent-dio"
version = "0.1.0"
description = "Pipeline CDC + Flink SQL para deteccao de fraude em pagamentos (DIO IBM + Confluent)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "TRY", "RUF"]
ignore = ["E501", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"consumers/fraud_consumer.py" = ["E402"]
"scripts/*.py" = ["E402"]
